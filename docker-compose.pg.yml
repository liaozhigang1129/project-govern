# 本地 E2E 用:启 PG 16 + 后端(连 PG)
# 用法: docker compose -f docker-compose.pg.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: project-govern-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_govern
      POSTGRES_USER: project_govern
      POSTGRES_PASSWORD: project_govern_dev_2025
      TZ: Asia/Shanghai
    command:
      - "postgres"
      - "-c"
      - "timezone=Asia/Shanghai"
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_govern -d project_govern"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [project-govern-pg-net]

volumes:
  pg_data:

networks:
  project-govern-pg-net:
    driver: bridge
