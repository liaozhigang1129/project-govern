# GitHub Actions — PMO · PMS CI
#
# 触发: push / pull_request 到 main + 手动 dispatch
# 流程: 后端 mvn test → 前端 lint+build → 集成冒烟 → artifact 上传

name: CI

on:
  push:
    branches: [main, develop, feature/**]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Skip frontend build (frontend-only skip)'
        required: false
        default: 'false'

# 防止多个 PR 同时跑浪费 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认权限(谨慎,只读 token)
permissions:
  contents: read

env:
  # Java
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'
  # Frontend
  NODE_VERSION: '20'

jobs:
  # ========================================================================
  # JOB 1: 后端 — Maven 单测 + 编译
  # ========================================================================
  backend-test:
    name: 🧪 Backend (Maven Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史给 jacoco / version

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: ⚙️ Maven Settings (Aliyun mirror for CN speed)
        run: |
          mkdir -p ~/.m2
          cp .github/maven-config/settings.xml ~/.m2/settings.xml
          echo "✅ Maven mirror configured (Aliyun)"

      - name: 🧪 Run tests (H2 test profile)
        working-directory: backend
        # 默认走 src/test/resources/application-test.yml (H2 + PostgreSQL 模式)
        # 286/286 单测全绿,无需 MySQL 服务,跑得快
        run: mvn -B test -DfailIfNoTests=false

      - name: 📊 Collect Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: 📈 Publish Jacoco coverage
        if: success()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: true

  # ========================================================================
  # JOB 2: 后端 — 编译 + JAR 打包
  # ========================================================================
  backend-build:
    name: 🏗️ Backend (Build JAR)
    runs-on: ubuntu-latest
    needs: backend-test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: ⚙️ Maven Settings (Aliyun mirror for CN speed)
        run: |
          mkdir -p ~/.m2
          cp .github/maven-config/settings.xml ~/.m2/settings.xml
          echo "✅ Maven mirror configured (Aliyun)"

      - name: 📦 Package JAR
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: ⬆️ Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 14

  # ========================================================================
  # JOB 3: 前端 — 依赖安装 + 类型检查 + 构建
  # ========================================================================
  frontend-build:
    name: 🎨 Frontend (Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Setup pnpm + install
        working-directory: frontend
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install -g pnpm@9
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --frozen-lockfile

      - name: 🔍 TypeScript type check
        working-directory: frontend
        run: pnpm exec vue-tsc --noEmit

      - name: 🏗️ Build
        working-directory: frontend
        run: pnpm build

      - name: ⬆️ Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  # ========================================================================
  # JOB 4: 集成冒烟(后端启动 + 健康检查)
  # ========================================================================
  integration-smoke:
    name: 🚬 Integration Smoke
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: ⬇️ Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: dist/

      - name: 🚀 Start backend (H2 profile)
        run: |
          JAR=$(ls dist/*.jar | head -1)
          echo "Starting $JAR"
          SPRING_PROFILES_ACTIVE=h2 \
            java -jar "$JAR" \
              --server.port=18080 \
              --spring.datasource.url=jdbc:h2:mem:smoke \
              > app.log 2>&1 &
          echo $! > app.pid

      - name: ⏳ Wait for /actuator/health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:18080/actuator/health > /dev/null 2>&1; then
              echo "✅ Health check passed"
              curl -s http://127.0.0.1:18080/actuator/health
              exit 0
            fi
            sleep 2
          done
          echo "❌ Health check failed"
          cat app.log | tail -50
          exit 1

      - name: 🔌 Test login endpoint
        run: |
          # 探测核心端点(允许 401 — 说明服务在跑)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/auth/login -X POST -H 'Content-Type: application/json' -d '{}')
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "400" ] || [ "$STATUS" = "401" ]; then
            echo "✅ Login endpoint reachable (HTTP $STATUS)"
          else
            echo "❌ Unexpected: $STATUS"
            cat app.log | tail -30
            exit 1
          fi

      - name: 🛑 Stop backend
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

  # ========================================================================
  # JOB 5: 汇总状态
  # ========================================================================
  ci-status:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [backend-test, backend-build, frontend-build, integration-smoke]
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.backend-test.result }}" = "success" ] && \
             [ "${{ needs.backend-build.result }}" = "success" ] && \
             [ "${{ needs.frontend-build.result }}" = "success" ] && \
             [ "${{ needs.integration-smoke.result }}" = "success" ]; then
            echo "## 🎉 All CI jobs passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Some jobs failed" >> $GITHUB_STEP_SUMMARY
            echo "- backend-test: ${{ needs.backend-test.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- backend-build: ${{ needs.backend-build.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- frontend-build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- integration-smoke: ${{ needs.integration-smoke.result }}" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### 📊 Coverage artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Backend JAR: see 'backend-jar'" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend dist: see 'frontend-dist'" >> $GITHUB_STEP_SUMMARY
          echo "- Surefire reports: see 'backend-surefire-reports'" >> $GITHUB_STEP_SUMMARY