upstream pmo_backend {
    server pmo-backend:8088 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反代 — V4.18 上游 keepalive + 自动重试 502/503/504
    # V4.20: PROMPT 路径走通义千问 30-50s 经常接近 60s 上限;提到 180s 兜底长尾
    location /api/ {
        proxy_pass http://pmo_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # 关 client 端 keepalive, 让 nginx→upstream 长连接
        proxy_connect_timeout 5s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    # 健康检查
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # SPA 路由 fallback (Vue Router history 模式)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}