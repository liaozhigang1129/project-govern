# 开发用:把本地源码挂载进去,改代码后端 spring-boot:devtools 自动重载
# 用法: docker compose -f docker-compose.yml -f docker-compose.override.yml up
services:
  backend:
    build:
      target: build  # 停在这阶段,跑 devtools
    command: ["mvn","-s",".mvn-settings.xml","spring-boot:run"]
    volumes:
      - ./backend/src:/workspace/src
      - ./backend/.mvn-settings.xml:/workspace/.mvn-settings.xml
      - ~/.m2:/root/.m2  # 共享 host m2 缓存
    environment:
      SPRING_DEVTOOLS_LIVERELOAD: "true"
      SPRING_DEVTOOLS_RESTART: "true"
